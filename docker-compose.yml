version: '3.8'

services:
  # Gophish: The Phishing Framework
  gophish:
    image: gophish/gophish:latest
    container_name: gophish_server
    ports:
      - "3333:3333" # Admin interface
      - "8080:80"   # Phishing landing page
    networks:
      - phishing_net

  # MailHog: A local SMTP server to catch test emails
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog_server
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI to view caught emails
    networks:
      - phishing_net

networks:
  phishing_net:
    driver: bridge
